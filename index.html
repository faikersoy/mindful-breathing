<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mindful Breathe & Meditate</title>
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: rgba(30, 41, 59, 0.75);
      --accent-blue: #38bdf8;
      --accent-yellow: #facc15;
      --accent-red: #f43f5e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-card {
      width: 94%;
      max-width: 420px;
      height: 94vh;
      height: 94dvh;
      max-height: 720px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--accent-blue);
    }

    .controls-top {
      display: flex;
      gap: 8px;
    }

    select, button, input {
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 8px;
      border-radius: 8px;
      outline: none;
      font-size: 0.78rem;
      width: 100%;
    }

    button {
      cursor: pointer;
    }

    .controls-section {
      transition: opacity 0.4s ease, filter 0.4s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .running .controls-section {
      opacity: 0.15;
      pointer-events: none;
      filter: blur(2px);
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .form-group label {
      font-size: 0.72rem;
      color: var(--text-sub);
    }

    .manual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      background: rgba(15, 23, 42, 0.3);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .toggles-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-sub);
      cursor: pointer;
    }

    .rounds-input-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.4);
      padding: 4px 8px;
      border-radius: 8px;
    }

    .rounds-input-container label {
      font-size: 0.75rem;
      color: var(--text-sub);
      white-space: nowrap;
    }

    .visualizer-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 5px 0;
    }

    .nose-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nose-svg {
      width: 60px;
      height: 60px;
      fill: none;
      stroke: var(--text-sub);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      z-index: 2;
      transition: all 0.5s ease;
    }

    .wind-ring {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid transparent;
      z-index: 1;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.5s ease;
    }

    /* Faz Renkleri */
    .phase-inhale .wind-ring {
      opacity: 1;
      border-color: var(--accent-blue);
      box-shadow: 0 0 25px var(--accent-blue);
      animation: inhaleWind 1.5s infinite alternate ease-in-out;
    }
    .phase-inhale .nose-svg {
      stroke: var(--accent-blue);
      filter: drop-shadow(0 0 8px var(--accent-blue));
    }

    .phase-hold .wind-ring {
      opacity: 1;
      border-color: var(--accent-yellow);
      box-shadow: 0 0 30px var(--accent-yellow);
      animation: holdWind 1s infinite alternate linear;
    }
    .phase-hold .nose-svg {
      stroke: var(--accent-yellow);
      filter: drop-shadow(0 0 10px var(--accent-yellow));
    }

    .phase-exhale .wind-ring {
      opacity: 1;
      border-color: var(--accent-red);
      box-shadow: 0 0 25px var(--accent-red);
      animation: exhaleWind 1.5s infinite alternate ease-in-out;
    }
    .phase-exhale .nose-svg {
      stroke: var(--accent-red);
      filter: drop-shadow(0 0 8px var(--accent-red));
    }

    @keyframes inhaleWind {
      0% { transform: scale(1.3); opacity: 0.3; }
      100% { transform: scale(0.85); opacity: 1; }
    }

    @keyframes holdWind {
      0% { transform: scale(1) rotate(0deg); opacity: 0.8; }
      100% { transform: scale(1.08) rotate(180deg); opacity: 1; }
    }

    @keyframes exhaleWind {
      0% { transform: scale(0.85); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0.2; }
    }

    .status-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 10px;
      height: 24px;
      letter-spacing: 0.5px;
    }

    .timer-text {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-top: 2px;
      height: 38px;
    }

    .round-counter-text {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 2px;
      height: 18px;
    }

    .start-btn {
      width: 100%;
      background: var(--accent-blue);
      color: #090d16;
      font-weight: 700;
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      transition: background 0.2s, transform 0.1s;
    }

    .start-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-card" id="app-card">
    
    <div class="top-bar">
      <h1 id="app-title">Nefes & Meditasyon</h1>
      <div class="controls-top">
        <select id="lang-select" style="width: 60px;">
          <option value="tr">TR</option>
          <option value="en">EN</option>
        </select>
        <button id="mute-btn" style="width: 36px;">🔊</button>
      </div>
    </div>

    <div class="controls-section">
      <div class="config-grid">
        <div class="form-group">
          <label id="lbl-technique">Nefes Tekniği</label>
          <select id="technique-select">
            <option value="478">4-7-8 Rahatlama</option>
            <option value="box">Kutusal Nefes (4-4-4-4)</option>
            <option value="manual">Manuel Giriş</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lbl-bg-sound">Arka Fon Ses</label>
          <select id="bg-sound-select">
            <option value="none">Sessiz</option>
            <option value="rain">Yağmur Sesi</option>
            <option value="walk">Yürüyüş Ambient Müziği</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lbl-start-sound">Başlangıç Sesi</label>
          <select id="start-sound-select">
            <option value="gong">Derin Gong (432Hz)</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lbl-end-sound">Bitiş Sesi</label>
          <select id="end-sound-select">
            <option value="gong">Şifa Gongu (528Hz)</option>
          </select>
        </div>
      </div>

      <!-- Manuel Input Alanı -->
      <div class="manual-grid" id="manual-inputs" style="display: none;">
        <div class="form-group">
          <label id="lbl-inhale">Nefes Al</label>
          <input type="number" id="in-time" value="4" min="1">
        </div>
        <div class="form-group">
          <label id="lbl-hold">Tut</label>
          <input type="number" id="hold-time" value="2" min="0">
        </div>
        <div class="form-group">
          <label id="lbl-exhale">Nefes Ver</label>
          <input type="number" id="ex-time" value="4" min="1">
        </div>
      </div>

      <div class="toggles-wrapper">
        <label class="toggle-item">
          <input type="checkbox" id="walk-mode" style="width: auto;">
          <span id="lbl-walk-mode">🚶‍♂️ Yürüyüş Meditasyonu</span>
        </label>

        <label class="toggle-item">
          <input type="checkbox" id="rounds-enable" style="width: auto;">
          <span id="lbl-rounds-enable">🔄 Tur Sayısı Belirle</span>
        </label>
      </div>

      <div class="rounds-input-container" id="rounds-config" style="display: none;">
        <label id="lbl-rounds-count">Tur Sayısı:</label>
        <input type="number" id="rounds-count" value="5" min="1" max="99" style="width: 70px;">
      </div>
    </div>

    <div class="visualizer-area" id="visualizer-area">
      <div class="nose-container">
        <div class="wind-ring"></div>
        <svg class="nose-svg" viewBox="0 0 24 24">
          <path d="M12 3v10c0 1.5-1 3-2.5 3S7 14.5 7 13" />
          <path d="M12 13c0 1.5 1 3 2.5 3s2.5-1.5 2.5-3" />
        </svg>
      </div>

      <div class="status-text" id="phase-text">Hazır</div>
      <div class="timer-text" id="phase-timer">--</div>
      <div class="round-counter-text" id="round-counter"></div>
    </div>

    <button class="start-btn" id="start-btn">BAŞLAT</button>

  </div>

  <script>
    const dict = {
      tr: {
        title: "Nefes & Meditasyon",
        technique: "Nefes Tekniği",
        bgSound: "Arka Fon Ses",
        startSound: "Başlangıç Sesi",
        endSound: "Bitiş Sesi",
        walkMode: "🚶‍♂️ Yürüyüş Meditasyonu",
        roundsEnable: "🔄 Tur Sayısı Belirle",
        roundsCount: "Tur Sayısı:",
        roundLabel: "Tur",
        inhale: "Nefes Al",
        hold: "Nefes Tut",
        exhale: "Nefes Ver",
        ready: "Hazır",
        start: "BAŞLAT",
        stop: "DURDUR",
        opt_tech_478: "4-7-8 Rahatlama",
        opt_tech_box: "Kutusal Nefes (4-4-4-4)",
        opt_tech_manual: "Manuel Giriş",
        opt_bg_none: "Sessiz",
        opt_bg_rain: "Yağmur Sesi",
        opt_bg_walk: "Yürüyüş Ambient Müziği",
        opt_sound_gong_start: "Derin Gong (432Hz)",
        opt_sound_gong_end: "Şifa Gongu (528Hz)"
      },
      en: {
        title: "Breath & Meditate",
        technique: "Breathing Technique",
        bgSound: "Background Sound",
        startSound: "Start Sound",
        endSound: "End Sound",
        walkMode: "🚶‍♂️ Walking Meditation",
        roundsEnable: "🔄 Set Rounds",
        roundsCount: "Total Rounds:",
        roundLabel: "Round",
        inhale: "Inhale",
        hold: "Hold",
        exhale: "Exhale",
        ready: "Ready",
        start: "START",
        stop: "STOP",
        opt_tech_478: "4-7-8 Relax",
        opt_tech_box: "Box Breathing (4-4-4-4)",
        opt_tech_manual: "Manual Input",
        opt_bg_none: "Silent",
        opt_bg_rain: "Rain Sound",
        opt_bg_walk: "Walking Ambient Pad",
        opt_sound_gong_start: "Deep Gong (432Hz)",
        opt_sound_gong_end: "Healing Gong (528Hz)"
      }
    };

    let currentLang = 'tr';
    let isRunning = false;
    let isMuted = false;
    let timerId = null;

    let audioCtx = null;
    let rainSource = null;
    let rainGainNode = null;
    let walkInterval = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    document.addEventListener('click', () => getAudioContext(), { once: true });
    document.addEventListener('touchstart', () => getAudioContext(), { once: true });

    function triggerHaptic(type) {
      if ('vibrate' in navigator) {
        if (type === 'phase') navigator.vibrate(40);
        if (type === 'start') navigator.vibrate([60, 40, 60]);
      }
    }

    function playGong(freq = 432) {
      if (isMuted) return;
      const ctx = getAudioContext();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.5);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 2.5);

      osc.onended = () => {
        osc.disconnect();
        gain.disconnect();
      };
    }

    function startRain() {
      if (isMuted) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      stopRain();

      const bufferSize = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        let white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        data[i] *= 0.11;
        b6 = white * 0.115926;
      }

      rainSource = ctx.createBufferSource();
      rainSource.buffer = buffer;
      rainSource.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, ctx.currentTime);

      rainGainNode = ctx.createGain();
      rainGainNode.gain.setValueAtTime(0.12, ctx.currentTime);

      rainSource.connect(filter);
      filter.connect(rainGainNode);
      rainGainNode.connect(ctx.destination);
      rainSource.start();
    }

    function stopRain() {
      if (rainSource) {
        try { 
          rainSource.stop();
          rainSource.disconnect();
          if (rainGainNode) rainGainNode.disconnect();
        } catch(e){}
        rainSource = null;
        rainGainNode = null;
      }
    }

    function startWalkMusic() {
      if (isMuted) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      stopWalkMusic();

      const chordNotes = [130.81, 164.81, 196.00, 246.94];
      let step = 0;

      walkInterval = setInterval(() => {
        if (isMuted || !isRunning) return;

        const noteFreq = chordNotes[step % chordNotes.length];
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(noteFreq, ctx.currentTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, ctx.currentTime);

        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.6);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.8);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 1.8);
        osc.onended = () => {
          osc.disconnect();
          filter.disconnect();
          gain.disconnect();
        };

        step++;
      }, 900);
    }

    function stopWalkMusic() {
      if (walkInterval) {
        clearInterval(walkInterval);
        walkInterval = null;
      }
    }

    const appCard = document.getElementById('app-card');
    const langSelect = document.getElementById('lang-select');
    const techniqueSelect = document.getElementById('technique-select');
    const bgSoundSelect = document.getElementById('bg-sound-select');
    const startSoundSelect = document.getElementById('start-sound-select');
    const endSoundSelect = document.getElementById('end-sound-select');
    const manualInputs = document.getElementById('manual-inputs');
    const walkModeCheckbox = document.getElementById('walk-mode');
    const roundsEnableCheckbox = document.getElementById('rounds-enable');
    const roundsConfig = document.getElementById('rounds-config');
    const roundsCountInput = document.getElementById('rounds-count');
    const startBtn = document.getElementById('start-btn');
    const muteBtn = document.getElementById('mute-btn');
    const visualizerArea = document.getElementById('visualizer-area');
    const phaseText = document.getElementById('phase-text');
    const phaseTimer = document.getElementById('phase-timer');
    const roundCounter = document.getElementById('round-counter');

    function updateLanguage(lang) {
      currentLang = lang;
      const t = dict[lang];

      document.getElementById('app-title').innerText = t.title;
      document.getElementById('lbl-technique').innerText = t.technique;
      document.getElementById('lbl-bg-sound').innerText = t.bgSound;
      document.getElementById('lbl-start-sound').innerText = t.startSound;
      document.getElementById('lbl-end-sound').innerText = t.endSound;
      document.getElementById('lbl-walk-mode').innerText = t.walkMode;
      document.getElementById('lbl-rounds-enable').innerText = t.roundsEnable;
      document.getElementById('lbl-rounds-count').innerText = t.roundsCount;
      document.getElementById('lbl-inhale').innerText = t.inhale;
      document.getElementById('lbl-hold').innerText = t.hold;
      document.getElementById('lbl-exhale').innerText = t.exhale;
      
      techniqueSelect.options[0].text = t.opt_tech_478;
      techniqueSelect.options[1].text = t.opt_tech_box;
      techniqueSelect.options[2].text = t.opt_tech_manual;

      bgSoundSelect.options[0].text = t.opt_bg_none;
      bgSoundSelect.options[1].text = t.opt_bg_rain;
      bgSoundSelect.options[2].text = t.opt_bg_walk;

      startSoundSelect.options[0].text = t.opt_sound_gong_start;
      endSoundSelect.options[0].text = t.opt_sound_gong_end;

      if (!isRunning) {
        phaseText.innerText = t.ready;
        startBtn.innerText = t.start;
        roundCounter.innerText = '';
      }
    }

    langSelect.addEventListener('change', (e) => updateLanguage(e.target.value));

    techniqueSelect.addEventListener('change', (e) => {
      manualInputs.style.display = e.target.value === 'manual' ? 'grid' : 'none';
    });

    walkModeCheckbox.addEventListener('change', (e) => {
      if (e.target.checked) {
        bgSoundSelect.value = 'walk';
      }
    });

    roundsEnableCheckbox.addEventListener('change', (e) => {
      roundsConfig.style.display = e.target.checked ? 'flex' : 'none';
    });

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.innerText = isMuted ? '🔇' : '🔊';
      if (isMuted) {
        stopRain();
        stopWalkMusic();
      } else if (isRunning) {
        if (bgSoundSelect.value === 'rain') startRain();
        if (bgSoundSelect.value === 'walk') startWalkMusic();
      }
    });

    function getTimes() {
      const mode = techniqueSelect.value;
      if (mode === '478') return { in: 4, hold: 7, out: 8 };
      if (mode === 'box') return { in: 4, hold: 4, out: 4 };
      return {
        in: Math.max(1, parseInt(document.getElementById('in-time').value) || 4),
        hold: Math.max(0, parseInt(document.getElementById('hold-time').value) || 0),
        out: Math.max(1, parseInt(document.getElementById('ex-time').value) || 4)
      };
    }

    function setVisualPhase(phase) {
      visualizerArea.classList.remove('phase-inhale', 'phase-hold', 'phase-exhale');
      if (phase === 'in') visualizerArea.classList.add('phase-inhale');
      if (phase === 'hold') visualizerArea.classList.add('phase-hold');
      if (phase === 'out') visualizerArea.classList.add('phase-exhale');
    }

    function startBreathing() {
      getAudioContext();
      isRunning = true;
      appCard.classList.add('running');
      startBtn.innerText = dict[currentLang].stop;
      playGong(432);
      triggerHaptic('start');

      if (bgSoundSelect.value === 'rain') startRain();
      if (bgSoundSelect.value === 'walk') startWalkMusic();

      const times = getTimes();
      const isRoundsEnabled = roundsEnableCheckbox.checked;
      const totalRounds = isRoundsEnabled ? Math.max(1, parseInt(roundsCountInput.value) || 1) : 0;
      
      let currentRound = 1;
      let currentPhase = 'in';
      let timeLeft = times.in;

      function updateRoundUI() {
        if (isRoundsEnabled) {
          roundCounter.innerText = `${dict[currentLang].roundLabel}: ${currentRound} / ${totalRounds}`;
        } else {
          roundCounter.innerText = '';
        }
      }

      function updatePhaseUI() {
        if (currentPhase === 'in') {
          phaseText.innerText = dict[currentLang].inhale;
          setVisualPhase('in');
        } else if (currentPhase === 'hold') {
          phaseText.innerText = dict[currentLang].hold;
          setVisualPhase('hold');
        } else if (currentPhase === 'out') {
          phaseText.innerText = dict[currentLang].exhale;
          setVisualPhase('out');
        }
        triggerHaptic('phase');
      }

      updateRoundUI();
      updatePhaseUI();
      phaseTimer.innerText = timeLeft;

      timerId = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          phaseTimer.innerText = timeLeft;
        } else {
          // Faz Değişimi
          if (currentPhase === 'in') {
            if (times.hold > 0) {
              currentPhase = 'hold';
              timeLeft = times.hold;
            } else {
              currentPhase = 'out';
              timeLeft = times.out;
            }
          } else if (currentPhase === 'hold') {
            currentPhase = 'out';
            timeLeft = times.out;
          } else if (currentPhase === 'out') {
            // Bir tur tamamlandı
            if (isRoundsEnabled && currentRound >= totalRounds) {
              stopBreathing();
              return;
            }
            currentRound++;
            updateRoundUI();
            currentPhase = 'in';
            timeLeft = times.in;
          }
          updatePhaseUI();
          phaseTimer.innerText = timeLeft;
        }
      }, 1000);
    }

    function stopBreathing() {
      isRunning = false;
      appCard.classList.remove('running');
      if (timerId) clearInterval(timerId);
      stopRain();
      stopWalkMusic();
      playGong(528); // Bitiş Gongu
      triggerHaptic('start');
      
      startBtn.innerText = dict[currentLang].start;
      phaseText.innerText = dict[currentLang].ready;
      phaseTimer.innerText = '--';
      roundCounter.innerText = '';
      visualizerArea.classList.remove('phase-inhale', 'phase-hold', 'phase-exhale');
    }

    startBtn.addEventListener('click', () => {
      if (isRunning) {
        stopBreathing();
      } else {
        startBreathing();
      }
    });

    updateLanguage('tr');
  </script>
</body>
</html>
